    <script>
      const params = new URLSearchParams(location.search);
      const route = params.get('p');
      if (route) {
        const isGitHubProjectSite = location.hostname.endsWith('github.io');
        const firstSegment = location.pathname.split('/').filter(Boolean)[0] || '';
        const base = isGitHubProjectSite && firstSegment ? `/${firstSegment}/` : '/';
        history.replaceState(null, '', base + route.replace(/^\//, ''));
      }
    </script>
